name: dwpwebsitelocal

services:
  dwpwebsitevscode:
    container_name: dwpwebsite
    init: true
    build:
      context: .
      dockerfile: ./dwpwebsite/Dockerfile
      # Coding CLIs are opt-in. Example:
      #   docker compose build --build-arg INSTALL_CLAUDE_CLI=true --build-arg INSTALL_CODEX_CLI=true
      args:
        INSTALL_CLAUDE_CLI: ${INSTALL_CLAUDE_CLI:-false}
        INSTALL_CURSOR_CLI: ${INSTALL_CURSOR_CLI:-false}
        INSTALL_CODEX_CLI: ${INSTALL_CODEX_CLI:-false}
        INSTALL_PI_CLI: ${INSTALL_PI_CLI:-false}
        INSTALL_OPENCODE_CLI: ${INSTALL_OPENCODE_CLI:-false}
        INSTALL_CLINE_CLI: ${INSTALL_CLINE_CLI:-false}
        INSTALL_GROK_CLI: ${INSTALL_GROK_CLI:-false}
    working_dir: /app
    volumes:
      - ../..:/app
      # Persistent data volumes for the node user (the only user that runs the AI CLIs)
      - claude_data:/home/node/.claude_data
      - codex_data:/home/node/.codex_data
      - cursor_data:/home/node/.cursor_data
      - gh_data:/home/node/.gh_data
      - dailybot_data:/home/node/.dailybot_data
      - chelper_data:/home/node/.chelper_data
      - cline_data:/home/node/.cline
      - opencode_data:/home/node/.opencode_data
      - pi_data:/home/node/.pi_data
      - herdr_data:/home/node/.herdr_data
      - grok_data:/home/node/.grok_data
      # Host SSH (read-only) — peers live under config.d/herdr-peers when present
      - ${HOME}/.ssh:/home/node/.ssh_host:ro
      # Optional Herdr catalog from the host (read-only). Absent mount is fine.
      - ${HOME}/.local/state/herdr/client:/home/node/.herdr_client_host:ro
      - ${HOME}/.gitconfig:/home/node/.gitconfig:ro
    ports:
      # Use 5555 on host to avoid conflict with macOS AirPlay Receiver on 5000
      - '5555:5555'
      # SSH for herdr --remote. 22022 is this repo's primary.
      # Avoid host:2222 — Cursor often binds 127.0.0.1:2222 on macOS.
      # Override with HERDR_SSH_HOST_PORT if 22022 is busy.
      - '127.0.0.1:${HERDR_SSH_HOST_PORT:-22022}:22'
    env_file:
      - dwpwebsite/.env
    environment:
      - DOCKER_DEV_ENV=vscode
      # Herdr, SSH, and agent CLIs spawn $SHELL (or /bin/sh if unset). Wrappers
      # like claude-glm live in docker/custom_commands.sh as bash functions,
      # so the default shell must be bash or those commands are "not found".
      - SHELL=/bin/bash
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - /bin/sh
      - -c
      - |
        sleep infinity

volumes:
  claude_data: {}        # Claude CLI session/auth (symlinked to ~/.claude)
  codex_data: {}         # Codex CLI session/auth (symlinked to ~/.codex)
  cursor_data: {}        # Cursor CLI session/auth (symlinked to ~/.cursor)
  gh_data: {}            # GitHub CLI session/auth (symlinked to ~/.config/gh)
  dailybot_data: {}      # Dailybot CLI config/auth (symlinked to ~/.config/dailybot)
  chelper_data: {}       # Z.AI Coding Tool Helper config (symlinked to ~/.chelper)
  cline_data: {}         # Cline CLI session/auth/config (persisted at ~/.cline)
  opencode_data: {}      # OpenCode config + share (symlinked to ~/.config/opencode, ~/.local/share/opencode)
  pi_data: {}            # Pi coding agent config/sessions (symlinked to ~/.pi)
  herdr_data: {}         # Herdr config/logs + SSH host keys (symlinked to ~/.config/herdr)
  grok_data: {}          # Grok/xAI CLI config + binary (symlinked to ~/.grok, ~/.local/bin/grok)
